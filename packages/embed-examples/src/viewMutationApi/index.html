<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../style.scss" />
    <title>View Mutation API</title>
    <style>
        #view-mutation-stage {
            position: relative;
        }

        #track-controls {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .track-controls {
            position: absolute;
            display: flex;
            gap: 4px;
            pointer-events: auto;
            transform: translateX(-100%);
        }
    </style>
</head>

<body>
    <a class="back-link" href="../">← All embedding examples</a>
    <h1>View Mutation API</h1>
    <div id="dashboard"></div>
    <div id="view-mutation-stage" class="visualization-surface">
        <div id="container"></div>
        <div id="track-controls"></div>
    </div>
    <script type="module" src="./index.js"></script>
</body>

</html>
