<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../style.scss" />
    <title>Linked GenomeSpy Embeds</title>
    <style>
        .linked-embeds h2 {
            font-size: 1em;
        }
    </style>
</head>

<body>
    <a class="back-link" href="../">← All embedding examples</a>
    <h1>Linked GenomeSpy Embeds</h1>

    <p>
        The GenomeSpy instances below use separate embeds. A <code>LinkingManager</code>
        registers each embed and synchronizes their named scale through the
        ScaleResolution API.
    </p>

    <div class="linked-embeds">
        <section>
            <h2>Embed A</h2>
            <div id="container-a" class="visualization-surface"></div>
        </section>
        <section>
            <h2>Embed B</h2>
            <div id="container-b" class="visualization-surface"></div>
        </section>
    </div>

    <div id="dashboard"></div>

    <script type="module" src="./index.js"></script>
</body>

</html>
