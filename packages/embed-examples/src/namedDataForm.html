<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="style.scss" />
        <title>Named Data Form</title>
    </head>

    <body>
        <h1>Named data with dynamic updates</h1>
        <p>
            Initial data is declared in the specification. Form changes update
            it through the owning view's <code>datasets.set</code> method.
        </p>

        <div id="container"></div>

        <form id="form">
            <p>Change the text to update data dynamically:</p>
            <div>
                <label for="A">A:</label>
                <input type="text" id="A" value="Hello" />
            </div>
            <div>
                <label for="B">B:</label>
                <input type="text" id="B" value="World" />
            </div>
        </form>

        <script type="module" src="/namedDataForm.js"></script>
    </body>
</html>
