name: Node.js CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "npm"
            - run: npm ci
            - run: npm run lint
            - run: npm --workspaces run test:tsc --if-present
            - run: npm -w @genome-spy/react-component run test
            - run: npm -w @genome-spy/embed-examples run test
            - run: npm -w @genome-spy/embed-examples run build:smoke
            - run: npm --workspaces run build --if-present
            - run: npm run test

    playground-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "npm"
            - run: npm ci
            - run: npm -w @genome-spy/core run build:schema
            - run: npx playwright install --with-deps --only-shell chromium
            - run: npm -w @genome-spy/playground run test:e2e
