name: Changesets

on:
    # TODO: Cover maintenance branches alongside Node.js CI when activating
    # CONTRIBUTING.md#future-major-release-lines.
    pull_request:
        branches: [master, main]
    push:
        branches: [master, main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx eslint scripts/release.mjs scripts/checkChangesets.mjs scripts/verifyPackedPackages.mjs scripts/release.test.mjs
            - run: npx eslint scripts/changelog.mjs scripts/changelog.test.mjs
            - name: Validate changesets and release package policy
              run: npm run release:check
            - run: npx vitest run --project release-tools --reporter=agent
